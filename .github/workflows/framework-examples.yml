name: Framework Examples

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/framework-examples.yml'
      - 'examples/taro/**'
      - 'examples/uniapp/**'
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'vite.config.*'
      - 'scripts/internal/**'
  schedule:
    - cron: '0 3 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }} example
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Taro
            directory: examples/taro
            script: build:weapp
            source: src/pages/test/test.tsx
            javascript: dist/pages/test/test.js
            map: dist/pages/test/test.js.map
          - name: uni-app
            directory: examples/uniapp
            script: build:mp-weixin
            source: src/pages/test/test.vue
            javascript: dist/build/mp-weixin/pages/test/test.js
            map: dist/build/.sourcemap/mp-weixin/pages/test/test.js.map

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install SDK dependencies
        run: yarn install --immutable

      - name: Build and pack current SDK
        run: |
          yarn run build
          yarn pack --out "$RUNNER_TEMP/sentry-miniapp.tgz"

      - name: Install example dependencies with current SDK
        working-directory: ${{ matrix.directory }}
        run: npm install --no-save --no-package-lock --no-audit --no-fund "$RUNNER_TEMP/sentry-miniapp.tgz"

      - name: Verify installed example dependency overrides
        run: node scripts/internal/check-example-dependencies.mjs "${{ matrix.directory }}/package.json"

      - name: Build example
        working-directory: ${{ matrix.directory }}
        run: npm run ${{ matrix.script }}

      - name: Verify business exception source mappings
        run: >-
          node scripts/internal/check-framework-sourcemaps.mjs
          "${{ matrix.directory }}/${{ matrix.source }}"
          "${{ matrix.directory }}/${{ matrix.javascript }}"
          "${{ matrix.directory }}/${{ matrix.map }}"
