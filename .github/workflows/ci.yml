name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality (Node 24.x)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: yarn install --immutable

    - name: Run shared quality checks
      run: node scripts/internal/release-checks.mjs quality

    - name: Save diagnostics
      if: always()
      timeout-minutes: 2
      uses: actions/upload-artifact@v4
      with:
        name: ci-quality-${{ github.run_attempt }}
        path: |
          diagnostics/
          coverage/
        if-no-files-found: ignore
        retention-days: 14

  # 保留 job id，使分支保护中的 build-and-test (20.x/22.x) 检查名继续有效。
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: yarn install --immutable

    - name: Run shared compatibility checks
      run: node scripts/internal/release-checks.mjs node

    - name: Save diagnostics
      if: always()
      timeout-minutes: 2
      uses: actions/upload-artifact@v4
      with:
        name: ci-node-${{ matrix.node-version }}-${{ github.run_attempt }}
        path: |
          diagnostics/
          coverage/
        if-no-files-found: ignore
        retention-days: 14
