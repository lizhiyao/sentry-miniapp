name: CD - Publish

on:
  push:
    tags:
      - 'v*' # 仅在推送以 'v' 开头的 Tag 时触发，例如 v1.4.0

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 同一 ref 的发布串行，避免重复推 tag 并发触发两次发布
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布成功后创建 / 更新 GitHub Release
      id-token: write # 这使得工作流能够通过 OIDC 从 GitHub 获取凭证

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      run: yarn install --immutable

    - name: Run Lint
      run: yarn run lint

    - name: Type Check
      run: yarn run typecheck

    - name: Run Tests
      run: yarn run test

    - name: Build Project
      run: yarn run build

    - name: Publish to NPM
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        VERSION="${TAG_NAME#v}"
        PACKAGE_VERSION="$(node -p "require('./package.json').version")"
        PUBLISH_TAG="latest"

        if [[ "$VERSION" == *-* ]]; then
          PUBLISH_TAG="next"
        fi

        if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
          echo "package.json version ($PACKAGE_VERSION) does not match tag ($TAG_NAME)"
          exit 1
        fi

        if npm view "sentry-miniapp@$VERSION" version >/dev/null 2>&1; then
          echo "sentry-miniapp@$VERSION is already published; skipping npm publish."
        else
          echo "Publishing sentry-miniapp@$VERSION with dist-tag $PUBLISH_TAG"
          npm publish --access public --provenance --tag "$PUBLISH_TAG"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        fail_on_unmatched_files: true
        files: |
          dist/sentry-miniapp.umd.js
          dist/sentry-miniapp.umd.js.map
