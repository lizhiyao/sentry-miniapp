name: CD - Publish

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      ci: ${{ steps.decision.outputs.ci }}
      frameworks: ${{ steps.decision.outputs.frameworks }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        package-manager-cache: false
    - name: Fetch release source history
      run: git fetch origin master
    - name: Validate release source and version
      id: source
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: |
        node --input-type=module <<'NODE'
        import { mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
        import { validateReleaseSource } from './scripts/internal/release-source.mjs';
        const source = validateReleaseSource(process.cwd(), process.env.TAG_NAME);
        mkdirSync('release-package', { recursive: true });
        writeFileSync('release-package/source.json', JSON.stringify({ ...source, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT }, null, 2));
        appendFileSync(process.env.GITHUB_OUTPUT, `sha=${source.sha}\n`);
        NODE
    - name: Find exact successful evidence for each group
      id: evidence
      continue-on-error: true
      timeout-minutes: 2
      uses: actions/github-script@v8
      env:
        RELEASE_SHA: ${{ steps.source.outputs.sha }}
      with:
        script: |
          const fs = require('node:fs');
          const { findReleaseEvidence } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/internal/ci-evidence.mjs`);
          const groups = await findReleaseEvidence(github, context.repo, process.env.RELEASE_SHA);
          fs.writeFileSync('release-package/ci-evidence.json', JSON.stringify(groups, null, 2));
    - name: Finalize fallback decisions
      id: decision
      env:
        QUERY_OUTCOME: ${{ steps.evidence.outcome }}
      run: |
        node --input-type=module <<'NODE'
        import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
        let groups;
        try {
          if (process.env.QUERY_OUTCOME !== 'success') throw new Error('Evidence query did not complete');
          groups = JSON.parse(readFileSync('release-package/ci-evidence.json', 'utf8'));
          if (!groups || ['ci', 'frameworks'].some(group => typeof groups[group]?.reused !== 'boolean')) throw new Error('Invalid evidence report');
        } catch (error) {
          groups = Object.fromEntries(['ci', 'frameworks'].map(group => [group, { reused: false, reason: error.message }]));
        }
        writeFileSync('release-package/ci-evidence.json', JSON.stringify(groups, null, 2));
        for (const group of ['ci', 'frameworks']) appendFileSync(process.env.GITHUB_OUTPUT, `${group}=${groups[group].reused === true}\n`);
        NODE
    - name: Save release plan
      uses: actions/upload-artifact@v4
      with:
        name: release-plan-${{ github.run_attempt }}
        path: release-package/
        if-no-files-found: error
        retention-days: 30

  fallback-nodes:
    needs: plan
    if: needs.plan.outputs.ci != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.plan.outputs.sha }}
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false
    - run: corepack enable
    - run: yarn install --immutable
    - name: Run shared compatibility checks
      run: node scripts/internal/release-checks.mjs node
    - name: Save fallback diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-node-${{ matrix.node-version }}-${{ github.run_attempt }}
        path: diagnostics/
        if-no-files-found: ignore
        retention-days: 30

  fallback-frameworks:
    needs: plan
    if: needs.plan.outputs.frameworks != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/framework-examples.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  publish:
    needs: [plan, fallback-nodes, fallback-frameworks]
    # An expected fallback must succeed; a failed/cancelled/skipped validation cannot publish.
    if: >-
      ${{ always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.ci == 'true' || needs.fallback-nodes.result == 'success') &&
      (needs.plan.outputs.frameworks == 'true' || needs.fallback-frameworks.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Checkout exact release commit
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.plan.outputs.sha }}
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false
    - name: Download source and evidence plan
      uses: actions/download-artifact@v4
      with:
        name: release-plan-${{ github.run_attempt }}
        path: release-package/

    # Pin npm for Trusted Publishing. Explicit tarball publish never rebuilds the package.
    - name: Setup npm for Trusted Publishing
      timeout-minutes: 2
      run: npm install --global npm@11.19.0

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies
      timeout-minutes: 4
      run: yarn install --immutable

    - name: Run shared fallback quality checks
      if: needs.plan.outputs.ci != 'true'
      run: node scripts/internal/release-checks.mjs quality-fallback

    - name: Save validation diagnostics before build
      if: always()
      timeout-minutes: 2
      uses: actions/upload-artifact@v4
      with:
        name: release-validation-${{ github.ref_name }}-${{ github.run_attempt }}
        path: diagnostics/
        if-no-files-found: ignore
        retention-days: 30

    - name: Build release once
      run: node scripts/internal/run-diagnosed.mjs build 180 yarn run build:release

    - name: Pack release
      env:
        RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      run: |
        npm pack --ignore-scripts --json --pack-destination release-package > release-package/pack.json
        node --input-type=module <<'NODE'
        import { readFileSync, writeFileSync } from 'node:fs';
        import { createHash } from 'node:crypto';
        import assert from 'node:assert/strict';
        const [pack] = JSON.parse(readFileSync('release-package/pack.json', 'utf8'));
        const source = JSON.parse(readFileSync('release-package/source.json', 'utf8'));
        assert.equal(source.sha, process.env.RELEASE_SHA);
        assert.equal(pack.name, source.name);
        assert.equal(pack.version, source.version);
        assert.equal(pack.filename, `${source.name}-${source.version}.tgz`);
        const bytes = readFileSync(`release-package/${pack.filename}`);
        const sha256 = createHash('sha256').update(bytes).digest('hex');
        const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
        writeFileSync('release-package/manifest.json', JSON.stringify({ ...source, filename: pack.filename, sha256, integrity }, null, 2));
        writeFileSync('release-package/SHA256SUMS', `${sha256}  release-package/${pack.filename}\n`);
        NODE

    - name: Install and validate exact release tarball
      run: |
        TARBALL="$(node -p "require('./release-package/manifest.json').filename")"
        node scripts/internal/run-diagnosed.mjs package 240 node scripts/internal/check-package-consumers.mjs "release-package/$TARBALL"
        sha256sum --check release-package/SHA256SUMS

    - name: Recheck release identity
      env:
        TAG_NAME: ${{ github.ref_name }}
        RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      run: |
        node --input-type=module <<'NODE'
        import { validateReleaseSource } from './scripts/internal/release-source.mjs';
        validateReleaseSource(process.cwd(), process.env.TAG_NAME, process.env.RELEASE_SHA);
        NODE

    - name: Publish exact verified tarball
      timeout-minutes: 3
      run: |
        sha256sum --check release-package/SHA256SUMS
        node scripts/internal/publish-tarball.mjs

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        fail_on_unmatched_files: true
        files: |
          dist/sentry-miniapp.umd.js
          dist/sentry-miniapp.umd.js.map
          release-package/*.tgz
          release-package/manifest.json

    - name: Save release evidence and diagnostics
      if: always()
      timeout-minutes: 2
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ github.ref_name }}-${{ github.run_attempt }}
        path: |
          diagnostics/
          release-package/
        if-no-files-found: warn
        retention-days: 30
