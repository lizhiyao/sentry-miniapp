version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      lint-toolchain:
        patterns:
          - eslint
          - '@eslint/*'
          - '@typescript-eslint/*'
          - globals
        update-types:
          - minor
          - patch
      vite-test-toolchain:
        patterns:
          - vite
          - vite-plugin-dts
          - vitest
          - '@vitest/*'
        update-types:
          - minor
          - patch
    ignore:
      # These major versions require Node 22, while the project still supports Node 20.
      - dependency-name: '@babel/core'
        update-types:
          - version-update:semver-major
      - dependency-name: '@commitlint/*'
        update-types:
          - version-update:semver-major
      - dependency-name: lint-staged
        update-types:
          - version-update:semver-major
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitest/*'
        update-types:
          - version-update:semver-major
      # Keep type definitions aligned with the supported Node 20 baseline.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /examples/uniapp
    schedule:
      interval: monthly
      time: '09:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    # Examples are compatibility fixtures; follow the framework, then update its
    # pinned build tool manually according to the new peer dependency contract.
    allow:
      - dependency-name: '@dcloudio/*'
    groups:
      uni-app-framework:
        patterns:
          - '@dcloudio/*'

  - package-ecosystem: npm
    directory: /examples/taro
    schedule:
      interval: monthly
      time: '09:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '@tarojs/*'
      - dependency-name: babel-preset-taro
    groups:
      taro-framework:
        patterns:
          - '@tarojs/*'
          - babel-preset-taro
