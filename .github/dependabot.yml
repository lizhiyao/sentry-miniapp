version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      commitlint-toolchain:
        patterns:
          - '@commitlint/*'
        update-types:
          - minor
          - patch
      lint-toolchain:
        patterns:
          - eslint
          - '@eslint/*'
          - '@typescript-eslint/*'
          - globals
        update-types:
          - minor
          - patch
      vite-test-toolchain:
        patterns:
          - vite
          - vite-plugin-dts
          - vitest
          - '@vitest/*'
        update-types:
          - minor
          - patch
    ignore:
      # These major versions require Node 22, while the project still supports Node 20.
      - dependency-name: '@babel/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@commitlint/*'
        update-types:
          - version-update:semver-major
      - dependency-name: lint-staged
        update-types:
          - version-update:semver-major
      - dependency-name: commit-and-tag-version
        update-types:
          - version-update:semver-major
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitest/*'
        update-types:
          - version-update:semver-major
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/jsdom'
        update-types:
          - version-update:semver-major
      # Keep type definitions aligned with the supported Node 20 baseline.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # The compiler major must satisfy the ESLint and declaration toolchain peers.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /examples/uniapp
    schedule:
      interval: monthly
      time: '09:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    # Keep framework updates grouped. Vite patch updates are reviewed separately;
    # broader toolchain migrations must follow the framework's peer contract.
    allow:
      - dependency-name: '@dcloudio/*'
      - dependency-name: vite
        update-types:
          - version-update:semver-patch
    groups:
      uni-app-framework:
        patterns:
          - '@dcloudio/*'

  - package-ecosystem: npm
    directory: /examples/taro
    schedule:
      interval: monthly
      time: '09:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '@tarojs/*'
      - dependency-name: babel-preset-taro
    groups:
      taro-framework:
        patterns:
          - '@tarojs/*'
          - babel-preset-taro
