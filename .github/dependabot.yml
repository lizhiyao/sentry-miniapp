version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      vite-test-toolchain:
        patterns:
          - vite
          - vite-plugin-dts
          - vitest
          - '@vitest/*'

  - package-ecosystem: npm
    directory: /examples/uniapp
    schedule:
      interval: monthly
      time: '09:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    # Examples are compatibility fixtures; follow the framework, then update its
    # pinned build tool manually according to the new peer dependency contract.
    allow:
      - dependency-name: '@dcloudio/*'
    groups:
      uni-app-framework:
        patterns:
          - '@dcloudio/*'

  - package-ecosystem: npm
    directory: /examples/taro
    schedule:
      interval: monthly
      time: '09:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '@tarojs/*'
      - dependency-name: babel-preset-taro
    groups:
      taro-framework:
        patterns:
          - '@tarojs/*'
          - babel-preset-taro
