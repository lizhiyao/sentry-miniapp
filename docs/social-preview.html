<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sentry-miniapp Social Preview</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: #172033;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .preview {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 420px;
    width: 100%;
    height: 100%;
  }

  .brand-panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 68px 72px 62px 82px;
    background: #172033;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .logo {
    width: 60px;
    height: 60px;
    padding: 4px;
    border-radius: 10px;
    background: #ffffff;
  }

  .product-name {
    font-size: 50px;
    font-weight: 750;
    line-height: 1;
    letter-spacing: 0;
  }

  .community-label {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    min-height: 30px;
    margin-top: 28px;
    padding: 4px 11px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 5px;
    color: #d9d3e5;
    font-size: 15px;
    font-weight: 600;
    line-height: 20px;
    letter-spacing: 0;
  }

  h1 {
    max-width: 690px;
    margin-top: 42px;
    color: #ffffff;
    font-size: 43px;
    font-weight: 700;
    line-height: 1.28;
    letter-spacing: 0;
  }

  .capabilities {
    display: flex;
    flex-wrap: wrap;
    gap: 11px 24px;
    max-width: 680px;
    margin-top: 28px;
    color: #cbd1dd;
    font-size: 20px;
    line-height: 1.5;
  }

  .capability {
    display: flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
  }

  .capability::before {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #139c8d;
    content: "";
  }

  .capability:nth-child(3)::before {
    background: #f2c46d;
  }

  .install {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: auto;
    color: #aeb7cb;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 17px;
    line-height: 24px;
  }

  .prompt {
    color: #f2c46d;
  }

  .coverage-panel {
    display: flex;
    flex-direction: column;
    padding: 72px 54px 58px;
    background: #f7f8fc;
    color: #172033;
  }

  .coverage-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: 0;
  }

  .coverage-count {
    margin-top: 8px;
    color: #139c8d;
    font-size: 34px;
    font-weight: 750;
    line-height: 1.2;
    letter-spacing: 0;
  }

  .coverage-list {
    display: flex;
    flex-direction: column;
    gap: 29px;
    margin-top: 42px;
  }

  .coverage-item {
    padding-top: 18px;
    border-top: 1px solid rgba(23, 32, 51, 0.12);
  }

  .coverage-label {
    color: #5d667a;
    font-size: 14px;
    font-weight: 650;
    line-height: 1.4;
    letter-spacing: 0;
  }

  .coverage-value {
    margin-top: 7px;
    color: #172033;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.55;
    letter-spacing: 0;
  }

</style>
</head>
<body>
  <main class="preview">
    <section class="brand-panel">
      <div class="brand">
        <img class="logo" src="./logo.png" alt="sentry-miniapp logo">
        <div class="product-name">sentry-miniapp</div>
      </div>

      <div class="community-label">Sentry Community SDK</div>

      <h1>跨端小程序 / 小游戏<br>Sentry SDK</h1>

      <div class="capabilities" aria-label="核心能力">
        <span class="capability">异常监控</span>
        <span class="capability">性能监控</span>
        <span class="capability">Source Map</span>
        <span class="capability">前后端链路追踪</span>
      </div>

      <div class="install"><span class="prompt">$</span> npm install sentry-miniapp</div>
    </section>

    <aside class="coverage-panel">
      <div class="coverage-title">一次接入，覆盖主流运行环境</div>
      <div class="coverage-count">7 端小程序</div>

      <div class="coverage-list">
        <div class="coverage-item">
          <div class="coverage-label">小程序平台</div>
          <div class="coverage-value">微信 · 支付宝 · 字节跳动<br>百度 · QQ · 钉钉 · 快手</div>
        </div>
        <div class="coverage-item">
          <div class="coverage-label">小游戏</div>
          <div class="coverage-value">微信 · 抖音</div>
        </div>
        <div class="coverage-item">
          <div class="coverage-label">跨端框架</div>
          <div class="coverage-value">Taro · uni-app</div>
        </div>
      </div>

    </aside>
  </main>
</body>
</html>
